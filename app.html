<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#221A2B">
<title>Mesa — contador y registro de Commander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Spectral:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#221A2B; --felt-2:#2B2136; --felt-3:#332741;
  --line:#3E3049; --bone:#EFE7DA; --muted:#A294B4;
  --brass:#D9A441; --jade:#63B48F; --rust:#C2604E; --steel:#7F93B8;
  --w:#F2E4C3; --u:#5B9BD8; --b:#6E5F82; --r:#CF5B44; --g:#57A46B; --c:#8C8395;
  --radius:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:var(--felt);color:var(--bone);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ============ navegación ============ */
.nav{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--felt);position:sticky;top:0;z-index:20}
.nav .brand{font-family:Spectral,Georgia,serif;font-weight:800;font-size:17px;margin-right:auto;letter-spacing:-.01em}
.tab{background:none;border:1px solid transparent;padding:9px 16px;min-height:42px;border-radius:99px;
  cursor:pointer;color:var(--muted);font-size:14.5px}
.tab:hover{color:var(--bone)}
.tab[aria-selected=true]{background:var(--felt-3);border-color:var(--line);color:var(--bone);font-weight:600}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}
.page{display:none}
.page.on{display:block}

/* ============ botones ============ */
.btn{font-size:14.5px;padding:11px 16px;min-height:46px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--felt-2);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--felt-3);border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#241B12;font-weight:600}
.btn.primary:hover{background:#E8B355}
.btn.danger{color:var(--rust);border-color:rgba(194,96,78,.5)}
.btn.danger:hover{background:rgba(194,96,78,.14);border-color:var(--rust)}
.btn.small{font-size:13.5px;padding:8px 13px;min-height:40px}
.btn.link{border:0;background:none;padding:8px 2px;min-height:40px;color:var(--muted)}
.btn.link:hover{color:var(--bone);background:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ============ pantalla de inicio ============ */
.setup h2{font-family:Spectral,Georgia,serif;font-weight:600;font-size:20px;margin:30px 0 12px}
.setup .lead{color:var(--muted);max-width:56ch;margin:26px 0 0}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:12px 18px;min-height:48px;border-radius:99px;border:1px solid var(--line);
  background:var(--felt-2);cursor:pointer;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.opt[aria-pressed=true]{border-color:var(--brass);background:var(--felt-3);color:var(--brass);font-weight:600}

/* ============ tablero ============ */
.board-screen{position:fixed;inset:0;display:flex;flex-direction:column;background:#100C15;z-index:30}
.board{flex:1;display:grid;gap:6px;padding:6px;position:relative;min-height:0}
.seat{position:relative;border-radius:8px;overflow:hidden;display:flex;
  align-items:center;justify-content:center;isolation:isolate;min-height:0}
.seat .bg{position:absolute;inset:0;z-index:-1}
.seat.out .bg{filter:grayscale(1) brightness(.4)}
.seat.out .inner{opacity:.45}
.inner{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  justify-content:space-between;padding:8px 10px}
.empiezo{position:absolute;inset:0;z-index:4;border:0;background:rgba(14,10,19,.62);
  color:var(--bone);font-size:17px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px}
.empiezo:active{background:rgba(217,164,65,.28)}
.empieza-badge{font-size:11px;font-weight:700;color:var(--brass);border:1px solid var(--brass);
  border-radius:99px;padding:2px 9px;display:inline-flex;align-items:center;gap:5px}
.seat{container-type:size}
@container (max-height: 210px){
  .seat-cmd{display:none}
  .more{min-height:34px;padding:5px 10px;font-size:11.5px}
  .more.solo{width:36px}
  .ctr{min-height:26px;padding:3px 8px;font-size:11.5px}
  .corona{width:42px;height:32px}
  .life{font-size:clamp(30px,9vh,54px)}
}
@container (max-height: 150px){
  .seat-bot{display:none}
}
.seat[data-rot="180"] .inner{transform:rotate(180deg)}
.seat[data-rot="90"] .inner,.seat[data-rot="270"] .inner{
  position:absolute;top:50%;left:50%;width:100cqh;height:100cqw}
.seat[data-rot="90"] .inner{transform:translate(-50%,-50%) rotate(90deg)}
.seat[data-rot="270"] .inner{transform:translate(-50%,-50%) rotate(270deg)}

/* vista cenital de la mesa en la pantalla previa */
.mesa-prev{display:grid;gap:6px;height:min(56vh,420px);margin-top:14px;padding:6px;
  border:1px solid var(--line);border-radius:10px;background:#100C15}
.pseat{position:relative;border-radius:7px;overflow:hidden;container-type:size;cursor:pointer;
  border:1px solid rgba(255,255,255,.13)}
.pseat.vacio{border-style:dashed;border-color:var(--line)}
.pseat:hover{border-color:var(--muted)}
.pseat:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.pseat .pbg{position:absolute;inset:0;z-index:-1}
.pinner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;padding:8px;text-align:center;overflow:hidden}
.pseat[data-rot="180"] .pinner{transform:rotate(180deg)}
.pseat[data-rot="90"] .pinner,.pseat[data-rot="270"] .pinner{
  position:absolute;top:50%;left:50%;width:100cqh;height:100cqw}
.pseat[data-rot="90"] .pinner{transform:translate(-50%,-50%) rotate(90deg)}
.pseat[data-rot="270"] .pinner{transform:translate(-50%,-50%) rotate(270deg)}
.pinner b{font-size:14.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinner .det{font-size:11.5px;color:rgba(255,255,255,.66);display:flex;align-items:center;gap:5px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinner .rot{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.24);border-radius:99px;
  font-size:12px;padding:8px 13px;min-height:40px;cursor:pointer;color:inherit;
  display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
.pinner .rot:hover{background:rgba(0,0,0,.7);border-color:var(--bone)}
.centro{display:grid;place-items:center;color:var(--muted);font-size:11.5px;text-align:center;padding:4px}
.seat-top{display:flex;align-items:center;gap:8px;font-size:13px;min-height:22px}
.seat-top>*{min-width:0;flex-shrink:0}
.seat-name{flex-shrink:1}
.seat-cmd{flex-shrink:2}
.seat-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat-cmd{color:rgba(255,255,255,.62);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.22);white-space:nowrap}
.badge.turn{background:var(--brass);color:#241B12;border-color:var(--brass);font-weight:700}
.life-row{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-height:0}
.life-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.corona{display:grid;place-items:center;width:52px;height:40px;border-radius:99px;
  background:rgba(217,164,65,.2);border:1px solid var(--brass);color:var(--brass);
  cursor:grab;touch-action:none;flex:none}
.corona:active{cursor:grabbing;background:rgba(217,164,65,.4)}
.corona-fantasma{position:fixed;z-index:80;transform:translate(-50%,-50%);pointer-events:none;
  color:var(--brass);filter:drop-shadow(0 5px 12px rgba(0,0,0,.65))}
.seat.destino{outline:3px solid var(--brass);outline-offset:-3px}
.arrastrando .tap{pointer-events:none}
.life{font-family:Spectral,Georgia,serif;font-weight:800;line-height:.9;
  font-size:clamp(38px,11vh,84px);text-shadow:0 2px 12px rgba(0,0,0,.45)}
.tap{flex:1;height:100%;background:none;border:0;cursor:pointer;font-size:34px;
  color:rgba(255,255,255,.5);display:grid;place-items:center;user-select:none;touch-action:manipulation}
.tap:active{background:rgba(255,255,255,.09)}
.delta{position:absolute;top:50%;left:50%;transform:translate(-50%,-160%);
  font-weight:700;font-size:19px;color:var(--brass);text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
.seat-bot{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:22px}
.seat-bot .more{margin-left:0}
.ctr{font-size:12.5px;padding:5px 10px;min-height:32px;border-radius:99px;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.2);display:inline-flex;gap:6px;align-items:center;font-weight:600}
.ctr.warn{border-color:var(--rust);color:#FFC3B6}
.more{background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.22);border-radius:99px;
  font-size:12.5px;padding:8px 13px;min-height:42px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;touch-action:manipulation}
.more:active{background:rgba(255,255,255,.16)}
.more.solo{width:44px;padding:0;justify-content:center}

.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  display:flex;gap:6px;align-items:center;background:rgba(16,12,21,.92);
  border:1px solid var(--line);border-radius:99px;padding:5px 6px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.hub .pass{border:0;background:var(--brass);color:#241B12;border-radius:22px;
  padding:8px 20px;min-height:50px;min-width:132px;font-weight:700;font-size:15px;cursor:pointer;
  display:flex;flex-direction:column;line-height:1.2;align-items:center;justify-content:center;
  touch-action:manipulation}
.hub .pass #quien{font-size:12px;font-weight:600;opacity:.82;line-height:1.15}
.hub .pass #crono{font-weight:800;font-size:26px;line-height:1.05;letter-spacing:.5px;
  font-variant-numeric:tabular-nums}
.hub .pass #estado{font-size:11.5px;font-weight:700;line-height:1.2;opacity:.9}
.hub .pass #estado:empty,.hub .pass #crono:empty{display:none}
.hub .pass.aviso #crono,.hub .pass.aviso #estado{color:#7C1B09}
.hub .pass.over{background:var(--rust);color:#fff}
.hub .pass.pausa{background:var(--steel);color:#131822}
.hub .pass.pausa #crono{opacity:.75}
.hub .ico.activo{background:var(--steel);border-color:var(--steel);color:#131822}
.hub .ico{border:1px solid var(--line);background:var(--felt-2);border-radius:99px;
  width:50px;height:50px;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.hub .ico:hover{background:var(--felt-3)}

/* ============ registro (ranking + fichas) ============ */
.top{padding:34px 0 24px;border-bottom:1px solid var(--line)}
.top h1{font-family:Spectral,Georgia,serif;font-weight:800;font-size:clamp(28px,5vw,42px);
  line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);max-width:56ch}
.top .meta{margin-top:14px;color:var(--muted);font-size:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 10px;flex-wrap:wrap}
.section-head h2{font-family:Spectral,Georgia,serif;font-weight:600;font-size:20px;margin:0}
.hint{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);
  padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--bone)}
thead th .arrow{opacity:.35;font-size:10px;margin-left:3px}
thead th.active .arrow{opacity:1;color:var(--brass)}
thead th.num,tbody td.num{text-align:right}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:hover{background:var(--felt-2)}
tbody tr:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
tbody td{padding:13px 8px;vertical-align:middle}
.pos{color:var(--muted);width:34px;font-size:13px}
tr.leader .pos,tr.leader .name{color:var(--brass)}
.name{font-weight:600;font-size:16px;display:block}
.sub{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;margin-top:3px}
.bar{display:flex;height:7px;width:118px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .v{background:var(--jade)} .bar .e{background:var(--steel)} .bar .d{background:var(--rust)}
.wr{font-weight:600}
.ic{flex:none;vertical-align:-.2em}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:9px;height:9px;border-radius:99px;border:1px solid rgba(0,0,0,.45)}
.pip.W{background:var(--w)} .pip.U{background:var(--u)} .pip.B{background:var(--b)}
.pip.R{background:var(--r)} .pip.G{background:var(--g)} .pip.C{background:var(--c)}
.back{background:none;border:0;color:var(--muted);font-size:14.5px;padding:10px 0;min-height:46px;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.back:hover{color:var(--bone)}
.player-head{padding:22px 0;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.player-head h2{font-family:Spectral,Georgia,serif;font-weight:800;font-size:32px;margin:0 0 6px}
.player-head .record{color:var(--muted)}
.record b{color:var(--bone);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);margin:20px 0 6px;overflow:hidden}
.tile{background:var(--felt-2);padding:15px 16px}
.tile .k{color:var(--muted);font-size:12.5px;line-height:1.35;margin-bottom:6px}
.tile .v{font-family:Spectral,Georgia,serif;font-size:26px;font-weight:600;line-height:1}
.tile .v small{font-size:13px;font-family:"IBM Plex Sans",sans-serif;color:var(--muted);font-weight:400}
.searchbar{display:flex;gap:10px;align-items:center;margin:24px 0 4px;flex-wrap:wrap}
.lupa{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
.lupa .ic{position:absolute;left:13px;color:var(--muted);pointer-events:none}
.lupa input{padding-left:42px}
label.btn{cursor:pointer}

/* desplegable con buscador */
.dd{margin:-6px 0 10px}
.dd-btn{width:100%;min-height:44px;background:var(--felt-3);border:1px solid var(--line);
  border-top:0;border-radius:0 0 var(--radius) var(--radius);color:var(--muted);
  font-size:13.5px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.dd-btn:hover{color:var(--bone)}
.dd-btn[aria-expanded=true] .ic{transform:rotate(180deg)}
.dd-panel{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);
  background:var(--felt);padding:12px}
.dd-panel .lupa{min-width:0}
.dd-lista{max-height:min(46vh,280px);overflow-y:auto;display:grid;gap:8px;margin-top:10px}
.dd-op{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  min-height:56px;background:var(--felt-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 12px;cursor:pointer;text-align:left;color:inherit}
.dd-op:hover{border-color:var(--muted);background:var(--felt-3)}
.dd-op .txt{display:flex;align-items:center;gap:11px;min-width:0}
.dd-op .txt b{display:block;font-weight:600}
.dd-op .txt span{color:var(--muted);font-size:12.5px}
.dd-op[hidden]{display:none}
.dd-vacio{color:var(--muted);font-size:13.5px;margin:10px 2px 0}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--felt-2);border:1px solid var(--line);color:var(--bone);font:inherit;
  padding:12px 14px;min-height:48px;border-radius:var(--radius);width:100%}
textarea{min-height:200px}
input[type=search]{flex:1;min-width:200px}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
.count{color:var(--muted);font-size:13px}
.game{border-bottom:1px solid var(--line);padding:18px 0}
.game-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.game-top .grow{flex:1}
.date{font-family:Spectral,Georgia,serif;font-size:17px;font-weight:600}
.dur{color:var(--muted);font-size:13px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid;font-weight:500}
.chip.v{color:var(--jade);border-color:rgba(99,180,143,.45);background:rgba(99,180,143,.09)}
.chip.e{color:var(--steel);border-color:rgba(127,147,184,.45);background:rgba(127,147,184,.09)}
.chip.d{color:var(--rust);border-color:rgba(194,96,78,.45);background:rgba(194,96,78,.09)}
.seats-log{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seat-log{background:var(--felt-2);padding:12px 14px}
.seat-log.me{background:var(--felt-3);box-shadow:inset 3px 0 0 var(--brass)}
.seat-log.win .who2{color:var(--jade)}
.who2{font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmdr{color:var(--muted);font-size:13.5px;margin-top:2px;display:flex;align-items:center;gap:7px}
.micro{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--muted)}
.micro span b{color:var(--bone);font-weight:600}
.longest,.longest b{color:var(--brass)}
.empty{padding:36px 0;color:var(--muted)}
.empty b{display:block;color:var(--bone);font-weight:600;margin-bottom:4px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ============ modal ============ */
.overlay{position:fixed;inset:0;background:rgba(12,8,17,.75);display:flex;
  align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto;z-index:60}
.modal{background:var(--felt);border:1px solid var(--line);border-radius:8px;width:100%;max-width:720px;margin:auto}
.modal-head{padding:18px 20px 13px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{font-family:Spectral,Georgia,serif;font-size:21px;margin:0;font-weight:600}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px 18px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.close{background:none;border:0;color:var(--muted);cursor:pointer;line-height:1;
  width:44px;height:44px;display:grid;place-items:center;border-radius:99px}
.close:hover{background:var(--felt-2)}
.close:hover{color:var(--bone)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row.cuatro{grid-template-columns:repeat(4,1fr)}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.seat-form{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--felt-2)}
.seat-form .seat-title{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:12px;color:var(--muted);font-size:12.5px}
.colors{display:flex;gap:6px}
.color-btn{width:46px;height:46px;border-radius:99px;border:1px solid var(--line);
  background:var(--felt-3);cursor:pointer;display:grid;place-items:center;padding:0}
.color-btn i{width:20px;height:20px;border-radius:99px;opacity:.28;border:1px solid rgba(0,0,0,.4)}
.color-btn[aria-pressed=true]{border-color:var(--bone)}
.color-btn[aria-pressed=true] i{opacity:1}
.errors{border:1px solid rgba(194,96,78,.5);background:rgba(194,96,78,.1);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;color:var(--rust);font-size:13.5px}
.errors ul{margin:6px 0 0;padding-left:18px}
textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5}
.stepper{display:flex;align-items:center;gap:10px;flex:none}
.stepper button{width:48px;height:48px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--felt-3);cursor:pointer;font-size:22px;display:grid;place-items:center}
.stepper button:hover{border-color:var(--muted)}
.stepper .val{min-width:38px;text-align:center;font-weight:700;font-size:18px}
.stepper .val.letal{color:var(--rust)}
.grid-list{display:grid;gap:10px}
.line{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:64px;
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--felt-2)}
.line .txt{display:flex;align-items:center;gap:11px;min-width:0}
.line .txt .ic-nope{flex:none;color:var(--muted)}
.line .txt>div{min-width:0}
.line .txt b{display:block;font-weight:600}
.line .txt span{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.log-list{max-height:340px;overflow-y:auto;font-size:13.5px}
.log-list div{padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.log-list div b{color:var(--bone);font-weight:600}
.log-list .t{color:var(--brass);font-size:12px;margin-right:8px}
.dado{font-family:Spectral,Georgia,serif;font-size:56px;font-weight:800;text-align:center;padding:10px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--felt-3);
  border:1px solid var(--brass);padding:10px 18px;border-radius:99px;font-size:14px;z-index:70}

@media (max-width:720px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .seats-log,.row,.row2{grid-template-columns:1fr}
  .row,.row.cuatro{grid-template-columns:1fr 1fr}
  .hide-s{display:none}
  tbody td{padding:11px 6px}
}
@media (prefers-reduced-motion:no-preference){
  .hub .pass.over{animation:latido .9s ease-in-out infinite}
  @keyframes latido{50%{background:#8E3527;transform:scale(1.04)}}
  tbody tr{transition:background .12s ease}
  .delta{animation:fl .25s ease}
  @keyframes fl{from{opacity:0;transform:translate(-50%,-120%)}}
}

  try{ const r = await window.storage.get(clave); return r && r.value ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function escribir(clave, valor){
  try{ await window.storage.set(clave, JSON.stringify(valor)); persistente = true; }

async function guardarConfig(){ await escribir(K.config, CONFIG); }
async function guardarJuego(){
  if(!JUEGO){ await escribir(K.juego, null); return; }
  const {undo, ...limpio} = JUEGO;
  await escribir(K.juego, limpio);

/* ==========================================================
   4. MODALES Y AVISOS
   ========================================================== */
const cajaModal = $("#modal");
let escHandler = null;
function abrirModal(titulo, cuerpo, pie){
  cajaModal.innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="modal-head"><h3>${esc(titulo)}</h3><button class="close" id="x" aria-label="Cerrar">×</button></div>
    <div class="modal-body">${cuerpo}</div>${pie ? `<div class="modal-foot">${pie}</div>` : ""}</div></div>`;
  $("#x").onclick = cerrarModal;
  $("#ov").onmousedown = e => { if(e.target.id === "ov") cerrarModal(); };
  escHandler = e => { if(e.key === "Escape") cerrarModal(); };
  document.addEventListener("keydown", escHandler);
}
function cerrarModal(){
  cajaModal.innerHTML = "";
  document.removeEventListener("keydown", escHandler);
}
function aviso(txt){
  const t = $("#toast");
  t.innerHTML = `<div class="toast">${esc(txt)}</div>`;
  clearTimeout(aviso._id);
  aviso._id = setTimeout(()=>{ t.innerHTML = ""; }, 2600);
}

   comandantes y su identidad de color, para poder sentarse con cualquiera de ellos
   sin volver a teclear nada. */
let perfilBorrador = null, guardarPerfilCB = null;

function editorPerfil(id, alGuardar){
  const base = id ? PERFILES.find(x=>x.id===id) : {id:uid(), nombre:"", mazos:[], ultimo:null};
  perfilBorrador = structuredClone(base);
  guardarPerfilCB = alGuardar || null;
  pintarEditorPerfil(!!id);
}

     <div id="p-err"></div>`,
    `${editando ? `<button class="btn danger" id="p-del">${ic("papelera",18)} Eliminar perfil</button>` : ""}
     <button class="btn" id="p-x">Cancelar</button>
     <button class="btn primary" id="p-ok">Guardar perfil</button>`);

  const leerNombre = ()=>{ b.nombre = $("#p-n").value.trim(); };

  $("#p-mas").onclick = ()=>{ leerNombre(); editorMazo(null, editando); };
  cajaModal.querySelectorAll("[data-mazo]").forEach(x=> x.onclick = ()=>{ leerNombre(); editorMazo(x.dataset.mazo, editando); });
  cajaModal.querySelectorAll("[data-borrarmazo]").forEach(x=> x.onclick = ()=>{
    leerNombre();
    b.mazos = b.mazos.filter(m=>m.id !== x.dataset.borrarmazo);
    pintarEditorPerfil(editando);
  });
  $("#p-x").onclick = cerrarModal;
  if(editando) $("#p-del").onclick = async ()=>{
    PERFILES = PERFILES.filter(x=>x.id !== b.id);
    await guardarPerfiles(); cerrarModal(); pintarInicio(); aviso("Perfil eliminado");
  };
  $("#p-ok").onclick = async ()=>{
    leerNombre();
    if(!b.nombre){ $("#p-err").innerHTML = `<div class="errors" style="margin:14px 0 0">El perfil necesita un nombre.</div>`; return; }
    const i = PERFILES.findIndex(x=>x.id === b.id);
    if(i >= 0) PERFILES[i] = b; else PERFILES.push(b);
    await guardarPerfiles();
    cerrarModal();
    const cb = guardarPerfilCB; guardarPerfilCB = null;
    if(cb) cb(b); else pintarInicio();
    aviso("Perfil guardado");

}

function editorMazo(mazoId, editandoPerfil){
  const b = perfilBorrador;
  const base = mazoId ? b.mazos.find(m=>m.id === mazoId) : {id:uid(), c:"", c2:"", col:""};
  const m = {...base};
  abrirModal(mazoId ? "Editar mazo" : "Nuevo mazo",
    `<div class="field"><label for="m-c">Comandante</label>
       <input type="text" id="m-c" value="${esc(m.c)}" placeholder="Nombre en inglés"></div>
     <div class="field"><label for="m-c2">Compañero (opcional)</label>
       <input type="text" id="m-c2" value="${esc(m.c2)}" placeholder="Solo si el mazo lleva dos comandantes"></div>
     <div class="field" style="margin:0"><label>Identidad de color</label>
       <div class="colors" id="m-col">${COLORES.map(c=>`<button type="button" class="color-btn" data-color="${c}"
         aria-pressed="${m.col.includes(c)}" aria-label="Color ${c}"><i class="pip ${c}"></i></button>`).join("")}</div></div>
     <div id="m-err"></div>`,
    `<button class="btn" id="m-x">Cancelar</button>
     <button class="btn primary" id="m-ok">Guardar mazo</button>`);
  cajaModal.querySelectorAll("[data-color]").forEach(x=> x.onclick = ()=>{
    const c = x.dataset.color, set = new Set(m.col.split(""));
    set.has(c) ? set.delete(c) : set.add(c);
    m.col = COLORES.filter(y=>set.has(y)).join("");
    x.setAttribute("aria-pressed", set.has(c));
  });
  $("#m-x").onclick = ()=> pintarEditorPerfil(editandoPerfil);
  $("#m-ok").onclick = ()=>{
    m.c = $("#m-c").value.trim(); m.c2 = $("#m-c2").value.trim();
    if(!m.c){ $("#m-err").innerHTML = `<div class="errors" style="margin:14px 0 0">Escribe al menos el comandante principal.</div>`; return; }
    const i = b.mazos.findIndex(x=>x.id === m.id);
    if(i >= 0) b.mazos[i] = m; else b.mazos.push(m);
    if(!b.ultimo) b.ultimo = m.id;
    pintarEditorPerfil(editandoPerfil);
  };
}

/* Deja al jugador listo para sentarse con un mazo concreto. */
function asientoDesde(perfil, mazo){
  return {nombre:perfil.nombre, comandante:mazo ? mazo.c : "",
          comandante2:mazo ? mazo.c2 : "", colores:mazo ? mazo.col : ""};
}
const mazoUltimo = p => p.mazos.find(m=>m.id === p.ultimo) || p.mazos[0] || null;

let MESA = [null,null,null,null];
let INICIA = null;   // asiento que empieza la partida; null = lo decide el primero que toque

       <button class="opt" data-vida="otra" aria-pressed="${![20,25,30,40].includes(CONFIG.vidaInicial)}">Otra: ${CONFIG.vidaInicial}</button>

       ${[0,180,300,600].map(v=>`<button class="opt" data-lim="${v}" aria-pressed="${CONFIG.limiteTurno===v}">${v ? reloj(v)+" min" : "Sin límite"}</button>`).join("")}

       <p class="hint" style="margin:0;text-align:center">Su asiento sale marcado en la mesa y la partida arrancará con su turno.</p>`,
      `<button class="btn" id="ok3">Que lo decida otro</button>
       <button class="btn primary" id="ok2">Vale</button>`);

  };
  $("#copia-inicio").onclick = copiaSeguridad;
  $("#empezar").onclick = empezarPartida;
}

/* Desplegable con buscador. Se dibuja plegado y al abrirlo filtra la lista
   según se escribe. Sirve para cualquier lista larga: perfiles, mazos... */
function desplegable({id, titulo, marcador, opciones, abierto}){
  return `<div class="dd" id="dd-${id}">
    <button class="dd-btn" type="button" data-dd="${id}" aria-expanded="${!!abierto}">
      <span>${titulo}</span>${ic("abajo",18)}</button>
    <div class="dd-panel" ${abierto ? "" : "hidden"}>
      <span class="lupa">${ic("buscar",18)}
        <input type="search" class="dd-buscar" data-ddb="${id}" placeholder="${esc(marcador)}" autocomplete="off"></span>
      <div class="dd-lista">
        ${opciones.map(o=>`<button type="button" class="dd-op" data-ddop="${id}" data-valor="${esc(o.valor)}"
           data-txt="${esc(o.buscar || o.titulo)}">
          <span class="txt">${o.icono || ""}<div><b>${esc(o.titulo)}</b>${o.detalle ? `<span>${o.detalle}</span>` : ""}</div></span>
          ${o.marca ? `<span class="badge">${esc(o.marca)}</span>` : ""}</button>`).join("")}
      </div>
      <p class="dd-vacio" hidden>Nada coincide con la búsqueda.</p>
    </div></div>`;
}

function activarDesplegables(alElegir){
  cajaModal.querySelectorAll("[data-dd]").forEach(b=> b.onclick = ()=>{
    const panel = b.nextElementSibling;
    const abrir = panel.hasAttribute("hidden");
    if(abrir){ panel.removeAttribute("hidden"); } else { panel.setAttribute("hidden",""); }
    b.setAttribute("aria-expanded", abrir);
    if(abrir){ const inp = panel.querySelector(".dd-buscar"); if(inp) inp.focus(); }
  });
  cajaModal.querySelectorAll("[data-ddb]").forEach(inp=> inp.oninput = ()=>{
    const panel = inp.closest(".dd-panel");
    const q = inp.value.trim().toLowerCase();
    let visibles = 0;
    panel.querySelectorAll(".dd-op").forEach(op=>{
      const ok = !q || op.dataset.txt.toLowerCase().includes(q);
      op.hidden = !ok; if(ok) visibles++;
    });
    panel.querySelector(".dd-vacio").hidden = visibles > 0;
  });
  cajaModal.querySelectorAll("[data-ddop]").forEach(op=> op.onclick = ()=>
    alElegir(op.dataset.ddop, op.dataset.valor));
}

function elegirAsiento(i){
  const opcionesMazo = p => p.mazos.map(m=>({
    valor:`${p.id}::${m.id}`, titulo:dosComandantes(m.c, m.c2), icono:pips(m.col),
    buscar:`${m.c} ${m.c2} ${p.nombre}`, marca:p.ultimo === m.id ? "último" : ""}));

  const cuerpo = `
    <div class="grid-list" style="margin-bottom:16px">
      ${PERFILES.length ? PERFILES.map(p=>{
        const m = mazoUltimo(p), varios = p.mazos.length > 1;
        return `<div class="line">
            <span class="txt">${ic("persona",22)}<div><b>${esc(p.nombre)}</b>
              <span>${m ? `${pips(m.col)} ${esc(dosComandantes(m.c, m.c2))}` : "Sin mazos guardados"}</span></div></span>
            <button class="btn small" data-perf="${p.id}">Sentar</button>
          </div>
          ${varios ? desplegable({id:p.id, titulo:`Elegir otro de sus ${p.mazos.length} mazos`,
            marcador:"Buscar mazo por comandante", opciones:opcionesMazo(p)}) : ""}`;
      }).join("") : `<p class="hint" style="margin:0">Todavía no hay perfiles guardados.</p>`}
    </div>
    <div class="field" style="margin:0"><label for="suelto">O escribe un nombre solo para esta partida</label>
      <input type="text" id="suelto" placeholder="Invitado"></div>`;

  abrirModal(`Asiento ${i+1}`, cuerpo,
    `${MESA[i] ? `<button class="btn danger" id="vaciar">Dejar libre</button>` : ""}
     <button class="btn" id="nuevo">${ic("mas",18)} Crear perfil</button>
     <button class="btn primary" id="usar">Usar este nombre</button>`);

  cajaModal.querySelectorAll("[data-perf]").forEach(b=> b.onclick = ()=>{
    const p = PERFILES.find(x=>x.id === b.dataset.perf);
    sentarConMazo(i, p, mazoUltimo(p));
  });
  activarDesplegables((idPerfil, valor)=>{
    const [pid, mid] = valor.split("::");
    const p = PERFILES.find(x=>x.id === pid);
    sentarConMazo(i, p, p.mazos.find(m=>m.id === mid));
  });
  if(MESA[i]) $("#vaciar").onclick = ()=>{ MESA[i] = null; cerrarModal(); pintarInicio(); };
  $("#nuevo").onclick = ()=> editorPerfil(null, p=> sentarConMazo(i, p, mazoUltimo(p)));
  $("#usar").onclick = ()=>{
    const n = $("#suelto").value.trim();
    if(!n){ aviso("Escribe un nombre o elige un perfil"); return; }
    MESA[i] = {nombre:n, comandante:"", comandante2:"", colores:""};
    cerrarModal(); pintarInicio();
  };
}

async function sentarConMazo(i, perfil, mazo){
  MESA[i] = asientoDesde(perfil, mazo);
  if(mazo && perfil.ultimo !== mazo.id){
    perfil.ultimo = mazo.id;
    const k = PERFILES.findIndex(x=>x.id === perfil.id);
    if(k >= 0){ PERFILES[k] = perfil; await guardarPerfiles(); }
  }
  cerrarModal(); pintarInicio();
}



async function sentarConMazo(i, perfil, mazo){
  MESA[i] = asientoDesde(perfil, mazo);
  if(mazo && perfil.ultimo !== mazo.id){
    perfil.ultimo = mazo.id;
    const k = PERFILES.findIndex(x=>x.id === perfil.id);
    if(k >= 0){ PERFILES[k] = perfil; await guardarPerfiles(); }
  }
  cerrarModal(); pintarInicio();
}

function gestionarPerfiles(){
  abrirModal("Perfiles guardados",
    `<div class="grid-list">
      ${PERFILES.length ? PERFILES.map(p=>{
        const m = mazoUltimo(p);
        return `<div class="line">
          <span class="txt">${ic("persona",22)}<div><b>${esc(p.nombre)}</b>
            <span>${p.mazos.length ? `${p.mazos.length} ${p.mazos.length===1?"mazo":"mazos"}${
              m ? ` · ${pips(m.col)} ${esc(dosComandantes(m.c, m.c2))}` : ""}` : "Sin mazos"}</span></div></span>
          <button class="btn small" data-ed="${p.id}">${ic("lapiz",16)} Editar</button>
        </div>`;
      }).join("") : `<p class="hint" style="margin:0">Aún no hay perfiles. Crea el primero y quedará guardado para las próximas partidas.</p>`}
     </div>`,
    `<button class="btn" id="cerr">Cerrar</button>
     <button class="btn primary" id="crear">${ic("mas",18)} Crear perfil</button>`);
  cajaModal.querySelectorAll("[data-ed]").forEach(b=> b.onclick = ()=> editorPerfil(b.dataset.ed));
  $("#cerr").onclick = cerrarModal;
  $("#crear").onclick = ()=> editorPerfil(null);

     {id:"3c",n:"En columna",cols:"1fr",rows:"repeat(3,1fr)",rot:[180,180,0]}],
  4:[{id:"4a",n:"Dos y dos",cols:"1fr 1fr",rows:"1fr 1fr",rot:[180,180,0,0]},
     {id:"4b",n:"Uno en cada lado",cols:"1fr 1.1fr 1fr",rows:"1fr 1.3fr 1fr",
      areas:["1/1/2/4","2/1/3/2","2/3/3/4","3/1/4/4"],rot:[180,90,270,0],centro:"2/2/3/3"},
     {id:"4c",n:"En columna",cols:"1fr",rows:"repeat(4,1fr)",rot:[180,180,0,0]}],
  5:[{id:"5a",n:"Dos, dos y uno",cols:"1fr 1fr",rows:"repeat(3,1fr)",
      areas:[null,null,null,null,"3/1/4/3"],rot:[180,180,0,0,0]},
     {id:"5b",n:"Rodeando el móvil",cols:"1fr 1fr",rows:"repeat(3,1fr)",
      areas:["1/1/2/2","1/2/2/3","2/1/3/2","2/2/3/3","3/1/4/3"],rot:[180,180,90,270,0]},
     {id:"5c",n:"Todos en la misma dirección",cols:"1fr 1fr",rows:"repeat(3,1fr)",
      areas:[null,null,null,null,"3/1/4/3"],rot:[0,0,0,0,0]}],
  6:[{id:"6a",n:"Tres y tres",cols:"repeat(3,1fr)",rows:"1fr 1fr",rot:[180,180,180,0,0,0]},
     {id:"6b",n:"Rodeando el móvil",cols:"1fr 1fr",rows:"repeat(3,1fr)",rot:[180,180,90,270,0,0]},
     {id:"6c",n:"Dos columnas",cols:"1fr 1fr",rows:"repeat(3,1fr)",rot:[0,0,0,0,0,0]}],
};
function dispoActual(){
  const n = MESA.length;
  const guardada = (CONFIG.disposicion || {})[n];
  const base = (guardada && DISPOS[n].find(d=>d.id===guardada.id)) || DISPOS[n][0];
  const rot = (guardada && Array.isArray(guardada.rot) && guardada.rot.length === n)
    ? guardada.rot.slice() : base.rot.slice();
  return {...base, rot};
}
async function fijarDispo(d){
  CONFIG.disposicion = {...(CONFIG.disposicion||{}), [MESA.length]:{id:d.id, rot:d.rot}};
  await guardarConfig();
}
const LAYOUTS = {
  1:{c:1,r:1,rot:[]},
  2:{c:1,r:2,rot:[0]},
  3:{c:2,r:2,rot:[0],area:{0:"1 / 1 / 2 / 3"}},
  4:{c:2,r:2,rot:[0,1]},
  5:{c:2,r:3,rot:[0,1],area:{4:"3 / 1 / 4 / 3"}},
  6:{c:2,r:3,rot:[0,1]},
};
const DELTAS = {};
/* Aviso sonoro al pasarse del límite. El contexto de audio se despierta con el
   primer toque del usuario, que es lo que exigen los navegadores. */
let audio = null, alarmaSonada = false;
function ctxAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!audio) audio = new AC();
    if(audio.state === "suspended") audio.resume();
    return audio;
  }catch(e){ return null; }
}
function sonarAlarma(){
  if(CONFIG.sonido === false) return;
  try{ if(typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate([200,90,200,90,340]); }catch(e){}
  const ac = ctxAudio(); if(!ac) return;
  [[0,880,.22],[.3,880,.22],[.6,620,.5]].forEach(([t,hz,largo])=>{
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + t;
    o.type = "triangle"; o.frequency.value = hz;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(.28, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + largo);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + largo + .05);
  });
}

let tick = null, hold1 = null, hold2 = null;

function nuevoJugador(s, vida){
  return {n:s.nombre, c:s.comandante||"", c2:s.comandante2||"", col:s.colores||"", vida,
          dmg:{}, ven:0, exp:0, ene:0, tax:0, tes:0, tor:0,
          mana:{W:0,U:0,B:0,R:0,G:0,C:0},
          bendicion:false, rehacer:0, fuera:0, tTotal:0, tMax:0, out:false};
}

async function empezarPartida(){
  const gente = MESA.filter(Boolean);
  if(gente.length < 1){ aviso("Sienta al menos a un jugador"); return; }
  if(gente.length !== MESA.length){ aviso("Hay asientos libres. Quítalos o siéntate a alguien."); return; }
  JUEGO = {
    id:uid(), inicio:new Date().toISOString(),
    cfg:{vida:CONFIG.vidaInicial, limite:CONFIG.limiteTurno, dispo:dispoActual()},
    j:gente.map(s=>nuevoJugador(s, CONFIG.vidaInicial)),
    turno:(INICIA != null && MESA[INICIA]) ? INICIA : null,
    tIni:Date.now(), acum:0, pausado:false,
    monarca:null, iniciativa:null, dia:null,
    log:[], undo:[], fin:false
  };
  alarmaSonada = false;
  registrar(`Empieza la partida con ${JUEGO.j.length} jugadores a ${JUEGO.cfg.vida} vidas`);
  if(JUEGO.turno != null) registrar(`Empieza ${JUEGO.j[JUEGO.turno].n}`);
  await guardarJuego();
  pintarTablero();
}

/* Segundos que lleva el turno actual, sumando los tramos anteriores a las pausas. */
const transcurrido = () => JUEGO.turno == null ? 0
  : (JUEGO.acum || 0) + (JUEGO.pausado ? 0 : (Date.now() - JUEGO.tIni)/1000);

function alternarPausa(){
  if(JUEGO.turno == null){ aviso("La partida aún no ha empezado"); return; }
  foto();
  const j = JUEGO.j[JUEGO.turno];
  if(JUEGO.pausado){
    JUEGO.tIni = Date.now(); JUEGO.pausado = false;
    registrar(`Se reanuda el turno de ${j.n}`);
  }else{
    JUEGO.acum = transcurrido(); JUEGO.pausado = true;
    registrar(`Tiempo en pausa en el turno de ${j.n} a los ${reloj(JUEGO.acum)}`);
  }
  guardarJuego(); pintarCrono();
}

/* Cada comandante lleva su propia cuenta de daño (regla 903.10a): se rastrea por
   comandante y por jugador, sin importar quién lo controle. Por eso las claves son
   "asiento:hueco" y el propio comandante de uno también aparece en su lista. */
function comandantesEnMesa(){
  const lista = [];
  JUEGO.j.forEach((x,k)=>{
    lista.push({clave:`${k}:0`, nombre:x.c || "Comandante sin nombre", dueno:x.n, k, col:x.col});
    if(x.c2) lista.push({clave:`${k}:1`, nombre:x.c2, dueno:x.n, k, col:x.col});
  });
  return lista;
}
const nombreComandante = clave => {
  const c = comandantesEnMesa().find(x=>x.clave===clave);
  return c ? c.nombre : "Comandante";
};
/* Partidas guardadas antes de los compañeros: el daño iba por asiento, no por comandante. */
function migrarJuego(g){
  (g.j||[]).forEach(p=>{
    if(p.c2 === undefined) p.c2 = "";
    if(!p.mana) p.mana = {W:0,U:0,B:0,R:0,G:0,C:0};
    const d = {};
    for(const [k,v] of Object.entries(p.dmg||{})) d[String(k).includes(":") ? k : `${k}:0`] = v;
    p.dmg = d;
  });
  return g;
}

function registrar(txt){
  const t = Math.round((Date.now() - new Date(JUEGO.inicio).getTime())/1000);
  JUEGO.log.unshift({t, txt});
  if(JUEGO.log.length > 400) JUEGO.log.pop();
}
let ultimaFoto = 0;
function foto(agrupar){
  const ahora = Date.now();
  if(agrupar && ahora - ultimaFoto < 1500) return;
  ultimaFoto = ahora;
  const {undo, log, ...resto} = JUEGO;
  JUEGO.undo.push(JSON.stringify(resto));
  if(JUEGO.undo.length > 40) JUEGO.undo.shift();
}
function deshacer(){
  if(!JUEGO.undo.length){ aviso("No hay nada que deshacer"); return; }
  const previo = JSON.parse(JUEGO.undo.pop());
  const undo = JUEGO.undo, log = JUEGO.log;
  JUEGO = {...previo, undo, log};
  registrar("Se deshizo la última acción");
  guardarJuego(); pintarTablero();
}

function revisar(i){
  const j = JUEGO.j[i];
  const letalCmd = Object.values(j.dmg).some(v=>v>=21);
  const fuera = j.vida <= 0 || j.ven >= 10 || letalCmd;
  if(fuera && !j.out){
    j.out = true;
    registrar(`${j.n} queda fuera de la partida`);
    setTimeout(comprobarFinal, 350);
  }
}
function comprobarFinal(){
  if(!JUEGO || JUEGO.fin) return;
  const vivos = JUEGO.j.filter(x=>!x.out);
  if(JUEGO.j.length > 1 && vivos.length === 1){
    JUEGO.fin = true;
    terminarPartida(JUEGO.j.indexOf(vivos[0]));
  }
}

function cambiarVida(i, d){
  foto(true);
  const j = JUEGO.j[i];
  j.vida += d;
  const D = DELTAS[i] || (DELTAS[i] = {v:0});
  D.v += d;
  clearTimeout(D.timer);
  D.timer = setTimeout(()=>{
    if(D.v) registrar(`${j.n} ${D.v>0?"gana":"pierde"} ${Math.abs(D.v)} de vida y queda a ${j.vida}`);
    D.v = 0; pintarAsiento(i); guardarJuego();
  }, 2000);
  revisar(i);
  pintarAsiento(i);
}
function danoComandante(i, clave, d){
  foto();
  const j = JUEGO.j[i];
  const antes = j.dmg[clave] || 0;
  j.dmg[clave] = Math.max(0, antes + d);
  j.vida -= (j.dmg[clave] - antes);
  registrar(`${nombreComandante(clave)} deja a ${j.n} en ${j.dmg[clave]} de daño de comandante`);
  revisar(i);
  guardarJuego();
}
function contador(i, k, d){
  foto();
  const j = JUEGO.j[i];
  j[k] = Math.max(0, j[k] + d);
  const meta = CONTADORES.find(c=>c.k===k);
  if(d) registrar(`${j.n}: ${meta.n} a ${j[k]}`);
  revisar(i);
  guardarJuego();
}

/* Una jugada retirada: bajó la tierra, se arrepintió y jugó otra. No tiene nada que
   ver con el botón de deshacer, que solo corrige lo apuntado en la app. */
function retirada(i, d){
  foto();
  const j = JUEGO.j[i];
  j.rehacer = Math.max(0, j.rehacer + d);
  if(d > 0) registrar(`${j.n} retira una jugada y la rehace (van ${j.rehacer})`);
  guardarJuego(); pintarAsiento(i);
}

/* Sin sorteo previo, la partida espera a que alguien toque su asiento. */
function elegirInicio(i){
  if(!JUEGO || JUEGO.turno != null) return;
  JUEGO.turno = i;
  JUEGO.tIni = Date.now(); JUEGO.acum = 0; JUEGO.pausado = false;
  alarmaSonada = false;
  registrar(`Empieza ${JUEGO.j[i].n}`);
  guardarJuego(); pintarTablero();
}

function pasarTurno(){
  if(JUEGO.turno == null){ aviso("Primero, que alguien toque su asiento para empezar"); return; }
  const dur = transcurrido();
  const a = JUEGO.j[JUEGO.turno];
  foto();
  a.tTotal += dur;
  if(dur > a.tMax) a.tMax = dur;
  let pasado = false;
  if(JUEGO.cfg.limite && dur > JUEGO.cfg.limite){ a.fuera++; pasado = true; }
  registrar(`Turno de ${a.n}: ${reloj(dur)}${pasado ? " — se pasó del límite" : ""}`);
  let n = JUEGO.turno;
  for(let k=0;k<JUEGO.j.length;k++){ n = (n+1) % JUEGO.j.length; if(!JUEGO.j[n].out) break; }
  JUEGO.turno = n; JUEGO.tIni = Date.now(); JUEGO.acum = 0; JUEGO.pausado = false;
  alarmaSonada = false;
  guardarJuego(); pintarTablero();
}

   8. TABLERO

const cajaTablero = $("#tablero");

function pintarTablero(){
  if(!JUEGO){ cajaTablero.innerHTML = ""; clearInterval(tick); tick = null; return; }

    return {cols:`repeat(${L.c},1fr)`, rows:`repeat(${L.r},1fr)`,
            areas:JUEGO.j.map((_,i)=> (L.area && L.area[i]) || null),
            rot:JUEGO.j.map((_,i)=> L.rot.includes(i) ? 180 : 0)};
  })();
  cajaTablero.innerHTML = `
    <div class="board-screen">
      <div class="board" id="board" style="grid-template-columns:${D.cols};grid-template-rows:${D.rows}">
        ${JUEGO.j.map((_,i)=>`<div class="seat" id="asiento-${i}"></div>`).join("")}
        <div class="hub" ${D.centro ? `style="position:static;transform:none;grid-area:${D.centro};justify-self:center;align-self:center"` : ""}>
          <button class="ico" data-hub="deshacer" aria-label="Deshacer lo último apuntado">${ic("deshacer",22)}</button>
          <button class="ico" data-hub="pausa" id="btn-pausa" aria-label="Parar o reanudar el tiempo">${ic("pausa",22)}</button>
          <button class="pass" data-hub="pasar" aria-label="Pasar turno">
            <span id="quien"></span><small id="crono"></small><span id="estado"></span></button>
          <button class="ico" data-hub="menu" aria-label="Menú de la partida">${ic("puntos",22)}</button>
        </div>
      </div>
    </div>`;
  JUEGO.j.forEach((_,i)=>{
    const el = $("#asiento-"+i);
    if(D.areas && D.areas[i]) el.style.gridArea = D.areas[i];
    el.dataset.rot = String(D.rot[i] || 0);
    pintarAsiento(i);
  });
  calcularBordes();
  JUEGO.j.forEach((_,i)=> aplicarBordes(i));

/* El reloj central flota sobre la esquina interior de cada asiento. Para cada uno
   medimos hacia dónde le queda el centro del tablero y empujamos su fila de
   controles hacia el borde de fuera, teniendo en cuenta su giro. */
let BORDES = [];
const VECT = {
  0:   {arriba:[0,-1], abajo:[0,1],  fin:[1,0]},
  180: {arriba:[0,1],  abajo:[0,-1], fin:[-1,0]},
  90:  {arriba:[-1,0], abajo:[1,0],  fin:[0,1]},
  270: {arriba:[1,0],  abajo:[-1,0], fin:[0,-1]},
};
function calcularBordes(){
  BORDES = JUEGO ? JUEGO.j.map(()=>null) : [];
  if(!JUEGO) return;
  const D = JUEGO.cfg.dispo;
  if(D && D.centro) return;              // el reloj tiene su propia celda: nada que esquivar
  const board = $("#board"); if(!board) return;
  const b = board.getBoundingClientRect();
  const cx = b.left + b.width/2, cy = b.top + b.height/2;
  JUEGO.j.forEach((_,i)=>{
    const el = $("#asiento-"+i); if(!el) return;
    const r = el.getBoundingClientRect();
    if(!r.width || !r.height) return;
    const dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
    const hx = Math.abs(dx) < 8 ? 0 : Math.sign(dx);
    const hy = Math.abs(dy) < 8 ? 0 : Math.sign(dy);
    const v = VECT[+(el.dataset.rot||0)] || VECT[0];
    const mira = ([ex,ey]) => ex*hx + ey*hy > 0;      // ¿ese lado del contenido da al centro?
    const finDentro = mira(v.fin);
    const lado = finDentro ? "ini" : "fin";
    const hueco = Math.min(112, Math.max(60, Math.min(r.width, r.height) * .42));
    BORDES[i] = {
      arriba: mira(v.arriba) ? lado : null,
      abajo:  mira(v.abajo)  ? lado : null,
      hueco: Math.round(hueco) + "px"
    };
  });
}
function aplicarBordes(i){
  const c = BORDES[i], el = $("#asiento-"+i);
  if(!el) return;
  const filas = [[".seat-top", c && c.arriba], [".seat-bot", c && c.abajo]];
  for(const [sel, lado] of filas){
    const fila = el.querySelector(sel); if(!fila) return;
    const menu = fila.querySelector(".more");
    if(!lado){
      fila.style.justifyContent = fila.style.paddingInlineStart = fila.style.paddingInlineEnd = "";
      if(menu){ menu.style.order = ""; menu.style.marginLeft = sel === ".seat-top" ? "auto" : ""; }
      continue;
    }
    fila.style.justifyContent = lado === "ini" ? "flex-start" : "flex-end";
    fila.style.paddingInlineEnd   = lado === "ini" ? c.hueco : "";
    fila.style.paddingInlineStart = lado === "fin" ? c.hueco : "";
    if(menu){ menu.style.marginLeft = "0"; menu.style.order = lado === "ini" ? "-1" : ""; }
  }
}

function pintarAsiento(i){
  const j = JUEGO.j[i], el = $("#asiento-"+i);
  if(!el) return;
  const D = DELTAS[i];
  const esTurno = i === JUEGO.turno && !j.out;
  const recibido = Object.entries(j.dmg || {}).filter(([,v])=>v>0);
  const chips = [
    ...CONTADORES.filter(c=>j[c.k]>0).map(c=>
      `<span class="ctr ${c.letal && j[c.k]>=c.letal ? "warn":""}" title="${c.n}">${ic(c.i,16)} ${j[c.k]}</span>`),
    ...MANA.filter(m=>(j.mana||{})[m]>0).map(m=>`<span class="ctr"><i class="pip ${m}"></i>${j.mana[m]}</span>`),
    j.bendicion ? `<span class="ctr" title="Bendición de la ciudad">${ic("ciudad",16)}</span>` : "",
    j.fuera ? `<span class="ctr warn" title="Veces que se pasó de tiempo">${ic("reloj",16)} ${j.fuera}</span>` : "",
  ].filter(Boolean).join("");

  el.className = "seat" + (j.out ? " out" : "");
  const D2 = JUEGO.cfg.dispo;
  if(D2 && Array.isArray(D2.rot)) el.dataset.rot = String(D2.rot[i] || 0);
  el.innerHTML = `
    <div class="bg" style="background:${fondo(j.col)}"></div>
    ${D && D.v ? `<div class="delta">${D.v>0?"+":""}${D.v}</div>` : ""}
    <div class="inner">
      <div class="seat-top">
        <span class="seat-name">${esc(j.n)}</span>
        <span class="seat-cmd">${esc(j.c2 ? dosComandantes(j.c, j.c2) : (j.c || ""))}</span>
        ${esTurno ? `<span class="badge turn">Su turno</span>` : ""}
        ${JUEGO.iniciativa === i ? `<span class="badge">${ic("bandera",13)} Iniciativa</span>` : ""}
        ${j.out ? `<span class="badge">${ic("calavera",13)} Fuera</span>` : ""}
        <button class="more solo" data-menu="${i}" aria-label="Opciones de ${esc(j.n)}"
          style="margin-left:auto">${ic("puntos",20)}</button>
      </div>
      <div class="life-row">
        <button class="tap" data-tap="${i},-1" aria-label="Quitar vida">−</button>
        <div class="life-wrap">
          ${JUEGO.monarca === i ? `<span class="corona" data-corona="${i}" role="button"
             title="Arrastra la corona hasta el nuevo monarca">${ic("corona",24)}</span>` : ""}
          <div class="life">${j.vida}</div>
        </div>
        <button class="tap" data-tap="${i},1" aria-label="Sumar vida">+</button>
      </div>
      ${JUEGO.turno == null && !j.out ? `<button class="empiezo" data-inicia="${i}">
        ${ic("bandera",22)} Empiezo yo</button>` : ""}
      <div class="seat-bot">
        <button class="more" data-retirada="${i}" title="Retiró una jugada y la rehízo">${ic("retirada",17)} ${j.rehacer}</button>
        ${JUEGO.j.length > 1 ? `<button class="more" data-dmg="${i}">${ic("espadas",17)}${
          recibido.length ? " " + recibido.map(([k,v])=>
            `${esc(nombreComandante(k).split(/[ ,]/)[0])} ${v}`).join(" · ") : ""}</button>` : ""}
        ${chips}
      </div>
    </div>`;
  aplicarBordes(i);
}

function pintarCrono(){
  if(!JUEGO) return;
  const q = $("#quien"), c = $("#crono");
  if(!q) return;
  const est0 = $("#estado");
  if(JUEGO.turno == null){
    q.textContent = "¿Quién empieza?";
    c.textContent = "";
    if(est0) est0.textContent = "toca tu asiento";
    const b0 = q.closest(".pass");
    b0.classList.remove("over","aviso","pausa");
    return;
  }
  const j = JUEGO.j[JUEGO.turno];
  const dur = transcurrido();
  const lim = JUEGO.cfg.limite || 0;
  const queda = lim ? lim - dur : Infinity;
  const umbral = lim ? Math.min(60, Math.max(15, lim/3)) : 0;
  const pasado = !JUEGO.pausado && lim > 0 && dur > lim;
  const cerca  = !JUEGO.pausado && lim > 0 && !pasado && queda <= umbral;

  q.textContent = j.n.length > 13 ? j.n.slice(0,12)+"…" : j.n;
  c.textContent = reloj(dur);
  const est = $("#estado");
  if(est) est.textContent = JUEGO.pausado ? "en pausa"
    : pasado ? `se pasó ${reloj(dur - lim)}`
    : cerca  ? `quedan ${reloj(queda)}`
    : lim    ? `de ${reloj(lim)}` : "";

  const btn = q.closest(".pass");
  btn.classList.toggle("over", pasado);
  btn.classList.toggle("aviso", cerca);
  btn.classList.toggle("pausa", !!JUEGO.pausado);
  if(pasado && !alarmaSonada){ alarmaSonada = true; sonarAlarma(); }
  const bp = $("#btn-pausa");
  if(bp){
    bp.innerHTML = ic(JUEGO.pausado ? "play" : "pausa", 22);
    bp.classList.toggle("activo", !!JUEGO.pausado);
    bp.title = JUEGO.pausado ? "Reanudar el tiempo" : "Parar el tiempo";
  }
}

/* --- interacción --- */
/* La corona se arrastra de un jugador a otro: se coge, se sigue con el dedo y se
   suelta sobre el asiento que pasa a ser monarca. */
let corona = null;
function coronaSobre(x, y){
  const bajo = document.elementFromPoint(x, y);
  const asiento = bajo && bajo.closest ? bajo.closest(".seat") : null;
  return asiento ? +String(asiento.id).replace("asiento-","") : null;
}
function coronaMover(e){
  if(!corona) return;
  corona.fantasma.style.left = e.clientX + "px";
  corona.fantasma.style.top  = e.clientY + "px";
  const destino = coronaSobre(e.clientX, e.clientY);
  JUEGO.j.forEach((_,k)=>{
    const el = $("#asiento-"+k);
    if(el) el.classList.toggle("destino", k === destino && k !== corona.desde);
  });
}
async function coronaSoltar(e){
  if(!corona) return;
  const destino = coronaSobre(e.clientX, e.clientY);
  corona.fantasma.remove();
  document.body.classList.remove("arrastrando");
  const desde = corona.desde;
  corona = null;
  JUEGO.j.forEach((_,k)=>{ const el = $("#asiento-"+k); if(el) el.classList.remove("destino"); });
  if(destino == null || destino === desde){ pintarTablero(); return; }
  foto();
  JUEGO.monarca = destino;
  registrar(`La corona pasa de ${JUEGO.j[desde].n} a ${JUEGO.j[destino].n}`);
  await guardarJuego();
  pintarTablero();
}
addEventListener("pointermove", e=>{ if(corona) coronaMover(e); });
addEventListener("pointerup", e=>{ if(corona) coronaSoltar(e); });
addEventListener("pointercancel", e=>{ if(corona) coronaSoltar(e); });

cajaTablero.addEventListener("pointerdown", ()=>ctxAudio(), {once:true});
cajaTablero.addEventListener("pointerdown", e=>{
  const cor = e.target.closest("[data-corona]");
  if(cor){
    e.preventDefault();
    const fantasma = document.createElement("div");
    fantasma.className = "corona-fantasma";
    fantasma.innerHTML = ic("corona", 46);
    document.body.appendChild(fantasma);
    document.body.classList.add("arrastrando");
    corona = {desde:+cor.dataset.corona, fantasma};
    coronaMover(e);
    return;
  }
  const t = e.target.closest("[data-tap]");
  if(!t) return;
  e.preventDefault();
  const [i,d] = t.dataset.tap.split(",").map(Number);
  cambiarVida(i,d);
  hold1 = setTimeout(()=>{ hold2 = setInterval(()=>cambiarVida(i,d), 95); }, 450);
});
addEventListener("resize", ()=>{
  if(!JUEGO || !$("#board")) return;
  calcularBordes();
  JUEGO.j.forEach((_,i)=> aplicarBordes(i));
});
const soltar = ()=>{ clearTimeout(hold1); clearInterval(hold2); hold1 = hold2 = null; };
addEventListener("pointerup", soltar);
addEventListener("pointercancel", soltar);

cajaTablero.addEventListener("click", e=>{
  const menu = e.target.closest("[data-menu]");
  if(menu) return menuAsiento(+menu.dataset.menu);
  const dmg = e.target.closest("[data-dmg]");
  if(dmg) return panelDano(+dmg.dataset.dmg);
  const ini = e.target.closest("[data-inicia]");
  if(ini) return elegirInicio(+ini.dataset.inicia);
  const ret = e.target.closest("[data-retirada]");
