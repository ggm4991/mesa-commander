async function guardarComoPartida(ganador, total){
  const dur = transcurrido();
  const activo = JUEGO.turno == null ? null : JUEGO.j[JUEGO.turno];
  if(activo && dur > activo.tMax) activo.tMax = dur;

  const registroPartida = {
    id: uid(),
    fecha: JUEGO.inicio.slice(0,10),
    duracion: total,
    seats: JUEGO.j.map((x,k)=>({
      j: x.n,
      c: x.c || "Sin comandante",
      c2: x.c2 || "",
      id: x.col,
      r: ganador < 0 ? "E" : (k === ganador ? "V" : "D"),
      rehacer: x.rehacer,
      tiempo: x.fuera,
      turno: Math.round(x.tMax),
      vidaFinal: x.vida
    }))
  };
  const fallos = validar(registroPartida);
  if(fallos.length){ aviso(fallos[0]); return; }

  PARTIDAS.push(registroPartida);
  await guardarPartidas();
  JUEGO = null; await guardarJuego();
  cerrarModal(); cajaTablero.innerHTML = ""; clearInterval(tick); tick = null;
  vistaReg = {tipo:"ranking"};
  irA("registro");
  aviso("Partida registrada");
}

/* ==========================================================
   10. REGISTRO: RANKING, FICHAS Y CRUD
   ========================================================== */
const pagReg = $("#page-registro");
let orden = {campo:"pts", dir:-1};
let vistaReg = {tipo:"ranking"};
let busqueda = "";

const ganadorTurno = p => p.seats.reduce((a,b)=> b.turno > a.turno ? b : a).j;
const nombresJugadores = () => [...new Set(PARTIDAS.flatMap(p=>p.seats.map(s=>s.j)))].sort();
const nombresComandantes = () => [...new Set(PARTIDAS.flatMap(p=>p.seats.flatMap(s=>[s.c, s.c2])))]
  .filter(Boolean).sort();

function calcularJugadores(){
  const map = new Map();
  for(const p of PARTIDAS){
    const largo = ganadorTurno(p);
    for(const s of p.seats){
      if(!map.has(s.j)) map.set(s.j, {nombre:s.j,pj:0,v:0,e:0,d:0,rehacer:0,tiempo:0,
                                      turnoMax:0,turnosLargos:0,comandantes:new Map()});
      const x = map.get(s.j);
      x.pj++;
      if(s.r==="V") x.v++; else if(s.r==="E") x.e++; else x.d++;
      x.rehacer += +s.rehacer; x.tiempo += +s.tiempo;
      x.turnoMax = Math.max(x.turnoMax, s.turno);
      if(largo === s.j) x.turnosLargos++;
      const clave = dosComandantes(s.c, s.c2) + "|" + (s.id || "");
      x.comandantes.set(clave, (x.comandantes.get(clave)||0)+1);
    }
  }
  return [...map.values()].map(x=>{
    const top = [...x.comandantes.entries()].sort((a,b)=>b[1]-a[1])[0][0].split("|");
    return {...x, principal:top[0], principalId:top[1], pts:x.v*3 + x.e, wr:x.v/x.pj};
  });
}

function pintarRegistro(){
  const n = PARTIDAS.length;
  if(vistaReg.tipo === "jugador" && !nombresJugadores().includes(vistaReg.nombre)) vistaReg = {tipo:"ranking"};
  vistaReg.tipo === "ranking" ? pintarRanking(n) : pintarFicha(vistaReg.nombre);
}

function pintarRanking(n){
  const jug = calcularJugadores().sort((a,b)=>{
    const va = a[orden.campo], vb = b[orden.campo];
    return va === vb ? a.nombre.localeCompare(b.nombre) : (va > vb ? 1 : -1) * orden.dir;
  });
  const th = (campo,label,cls="") =>
    `<th class="sortable ${cls} ${orden.campo===campo?"active":""}" data-sort="${campo}">
       ${label}<span class="arrow">${orden.campo===campo ? (orden.dir<0?"▼":"▲") : "▼"}</span></th>`;

  pagReg.innerHTML = `
   <div class="top">
     <h1>Registro de la mesa</h1>
     <p>Todo lo que la app apunta durante la partida acaba aquí: victorias, empates, jugadas rehechas, pasadas de tiempo y turnos interminables.</p>
     <div class="meta">${n ? `${n} ${n===1?"partida registrada":"partidas registradas"} · ${nombresJugadores().length} jugadores · última el ${fechaLarga(PARTIDAS[0].fecha)}` : "Todavía no hay ninguna partida registrada."}</div>
   </div>
   <div class="section-head">
     <h2>Clasificación</h2>
     <span class="actions"><span class="hint">3 puntos por victoria, 1 por empate</span>
       <button class="btn primary" id="nueva">${ic("mas",18)} Añadir partida a mano</button></span>
   </div>
   ${!jug.length ? `<div class="empty"><b>Aún no hay partidas</b>
      Juega una con el contador o añádela a mano, y la clasificación aparecerá sola.</div>` : `
   <table><thead><tr>
      <th class="pos">#</th><th>Jugador</th><th class="hide-s">Balance</th>
      ${th("pts","Puntos","num")}${th("wr","% victorias","num")}
      ${th("rehacer","Jugadas retiradas","num hide-s")}${th("tiempo","Pasadas de tiempo","num hide-s")}
   </tr></thead><tbody>
   ${jug.map((p,i)=>`
      <tr tabindex="0" data-jugador="${esc(p.nombre)}" class="${i===0&&orden.campo==="pts"&&orden.dir<0?"leader":""}">
        <td class="pos">${i+1}</td>
        <td><span class="name">${esc(p.nombre)}</span>
            <span class="sub">${pips(p.principalId)} ${esc(p.principal)}</span></td>
        <td class="hide-s">
          <span class="bar" title="${p.v} victorias, ${p.e} empates, ${p.d} derrotas">
            <i class="v" style="width:${p.v/p.pj*100}%"></i><i class="e" style="width:${p.e/p.pj*100}%"></i>
            <i class="d" style="width:${p.d/p.pj*100}%"></i></span>
          <span class="sub">${p.v} V · ${p.e} E · ${p.d} D</span></td>
        <td class="num"><span class="wr">${p.pts}</span></td>
        <td class="num">${Math.round(p.wr*100)}%</td>
        <td class="num hide-s">${p.rehacer}</td>
        <td class="num hide-s">${p.tiempo}</td>
      </tr>`).join("")}
   </tbody></table>`}
   <footer><span id="almacen"></span>
     <button class="btn link" id="datos">${ic("datos",16)} Copia de seguridad</button></footer>`;

  $("#nueva").onclick = ()=> abrirFormulario(null);
  $("#datos").onclick = copiaSeguridad;
  pintarPie();
  pagReg.querySelectorAll("th.sortable").forEach(el=> el.onclick = ()=>{
    const c = el.dataset.sort;
    orden = orden.campo === c ? {campo:c, dir:orden.dir*-1} : {campo:c, dir:-1};
    pintarRegistro();
  });
  pagReg.querySelectorAll("tbody tr").forEach(tr=>{
    const ir = ()=>{ vistaReg = {tipo:"jugador", nombre:tr.dataset.jugador}; busqueda = ""; pintarRegistro(); scrollTo({top:0}); };
    tr.onclick = ir;
    tr.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir(); } };
  });
}

function pintarPie(){
  const el = $("#almacen");
  if(el) el.textContent = persistente
    ? "Los cambios se guardan y siguen aquí la próxima vez."
    : "Sin almacenamiento disponible: copia el JSON si no quieres perder los datos.";
}

function pintarFicha(nombre){
  const p = calcularJugadores().find(x=>x.nombre===nombre);
  pagReg.innerHTML = `
    <button class="back" id="back">${ic("atras",18)} Volver a la clasificación</button>
    <div class="player-head">
      <div><h2>${esc(p.nombre)}</h2>
        <div class="record"><b>${p.v}</b> victorias, <b>${p.e}</b> empates y <b>${p.d}</b> derrotas
          en ${p.pj} partidas · juega sobre todo ${pips(p.principalId)} ${esc(p.principal)}</div></div>
      <span class="actions">
        <button class="btn small" id="renombrar">${ic("lapiz",17)} Cambiar el nombre</button>
        <button class="btn primary small" id="nueva">${ic("mas",17)} Añadir partida</button></span>
    </div>
    <div class="tiles">
      <div class="tile"><div class="k">Jugadas retiradas</div><div class="v">${p.rehacer}</div></div>
      <div class="tile"><div class="k">Veces que se pasó de tiempo</div><div class="v">${p.tiempo}</div></div>
      <div class="tile"><div class="k">Turno más largo</div><div class="v">${reloj(p.turnoMax)} <small>min</small></div></div>
      <div class="tile"><div class="k">Partidas con el turno más largo de la mesa</div><div class="v">${p.turnosLargos} <small>de ${p.pj}</small></div></div>
    </div>
    <div class="searchbar">
      <span class="lupa">${ic("buscar",18)}<input type="search" id="q" value="${esc(busqueda)}"
        placeholder="Buscar por rival, comandante, fecha o resultado" autocomplete="off"></span>
      <span class="count" id="count"></span>
    </div>
    <div id="lista"></div>`;
  $("#back").onclick = ()=>{ vistaReg = {tipo:"ranking"}; pintarRegistro(); };
  $("#nueva").onclick = ()=> abrirFormulario(null);
  $("#renombrar").onclick = ()=> renombrar(nombre);
  $("#q").oninput = e=>{ busqueda = e.target.value; listarPartidas(nombre); };
  listarPartidas(nombre);
}

function listarPartidas(nombre){
  const suyas = PARTIDAS.filter(g=>g.seats.some(s=>s.j===nombre));
  const f = busqueda.trim().toLowerCase();
  const res = suyas.filter(g=>{
    if(!f) return true;
    const yo = g.seats.find(s=>s.j===nombre);
    return [fechaLarga(g.fecha), g.fecha, RES[yo.r].t, ...g.seats.map(s=>`${s.j} ${s.c}`)]
      .join(" ").toLowerCase().includes(f);
  });
  $("#count").textContent = `${res.length} de ${suyas.length} partidas`;
  const cont = $("#lista");
  if(!res.length){
    cont.innerHTML = `<div class="empty"><b>Ninguna partida coincide con “${esc(busqueda)}”</b>
      Prueba con el nombre de un rival, un comandante o una fecha como 2026-07.</div>`;
    return;
  }
  cont.innerHTML = res.map(g=>{
    const yo = g.seats.find(s=>s.j===nombre), largo = ganadorTurno(g);
    return `<article class="game">
      <div class="game-top">
        <span class="date">${fechaLarga(g.fecha)}</span>
        <span class="chip ${RES[yo.r].c}">${RES[yo.r].t}</span>
        <span class="dur grow">${duracion(g.duracion)} de partida · turno más largo de ${esc(largo)}</span>
        <button class="btn small" data-editar="${g.id}" aria-label="Editar la partida">${ic("lapiz",17)} Editar</button>
        <button class="btn small danger" data-borrar="${g.id}" aria-label="Eliminar la partida">${ic("papelera",17)} Eliminar</button>
      </div>
      <div class="seats-log">
        ${g.seats.map(s=>`
          <div class="seat-log ${s.j===nombre?"me":""} ${s.r==="V"?"win":""}">
            <div class="who2">${esc(s.j)}${s.r==="V"?" <span class='chip v'>ganó</span>":""}</div>
            <div class="cmdr">${pips(s.id)} ${esc(dosComandantes(s.c, s.c2))}</div>
            <div class="micro">
              <span>Retiradas <b>${s.rehacer}</b></span>
              <span>Fuera de tiempo <b>${s.tiempo}</b></span>
              <span class="${s.j===largo?"longest":""}">Turno más largo <b>${reloj(s.turno)}</b></span>
              ${s.vidaFinal!==undefined ? `<span>Vida final <b>${s.vidaFinal}</b></span>` : ""}
            </div>
          </div>`).join("")}
      </div></article>`;
  }).join("");
  cont.querySelectorAll("[data-editar]").forEach(b=> b.onclick = ()=> abrirFormulario(b.dataset.editar));
  cont.querySelectorAll("[data-borrar]").forEach(b=> b.onclick = ()=> confirmarBorrado(b.dataset.borrar));
}

/* --- alta y edición manual --- */
let borrador = null, errores = [];
const seatVacio = () => ({j:"",c:"",c2:"",id:"",r:"D",rehacer:0,tiempo:0,turno:180});

function abrirFormulario(id){
  const orig = id ? PARTIDAS.find(p=>p.id===id) : null;
  borrador = orig ? structuredClone(orig)
    : {id:uid(), fecha:hoy(), duracion:120, seats:[seatVacio(),seatVacio(),seatVacio(),seatVacio()]};
  errores = [];
  pintarFormulario(!!orig);
}

function pintarFormulario(editando){
  const cuerpo = `
    ${errores.length ? `<div class="errors">No se ha podido guardar:<ul>${errores.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
    <datalist id="dl-j">${nombresJugadores().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <datalist id="dl-c">${nombresComandantes().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="row">
      <div class="field"><label for="f-fecha">Fecha</label><input type="date" id="f-fecha" value="${borrador.fecha}"></div>
      <div class="field"><label for="f-dur">Duración en minutos</label>
        <input type="number" id="f-dur" min="1" max="900" value="${borrador.duracion}"></div>
      <div class="field"><label>Jugadores</label><input type="text" value="${borrador.seats.length}" disabled></div>
    </div>
    ${borrador.seats.map((s,i)=>`
      <div class="seat-form">
        <div class="seat-title"><span>Asiento ${i+1}</span>
          ${borrador.seats.length>2 ? `<button class="btn link danger" data-quitar="${i}">Quitar de la mesa</button>`:""}</div>
        <div class="row cuatro">
          <div class="field"><label>Jugador</label>
            <input type="text" list="dl-j" data-i="${i}" data-k="j" value="${esc(s.j)}" placeholder="Nombre"></div>
          <div class="field"><label>Comandante</label>
            <input type="text" list="dl-c" data-i="${i}" data-k="c" value="${esc(s.c)}" placeholder="Nombre en inglés"></div>
          <div class="field"><label>Compañero (opcional)</label>
            <input type="text" list="dl-c" data-i="${i}" data-k="c2" value="${esc(s.c2||"")}" placeholder="Si lleva dos"></div>
          <div class="field"><label>Resultado</label>
            <select data-i="${i}" data-k="r">
              <option value="V" ${s.r==="V"?"selected":""}>Victoria</option>
              <option value="D" ${s.r==="D"?"selected":""}>Derrota</option>
              <option value="E" ${s.r==="E"?"selected":""}>Empate</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label>Jugadas retiradas</label>
            <input type="number" min="0" max="99" data-i="${i}" data-k="rehacer" value="${s.rehacer}"></div>
          <div class="field"><label>Veces fuera de tiempo</label>
            <input type="number" min="0" max="99" data-i="${i}" data-k="tiempo" value="${s.tiempo}"></div>
          <div class="field"><label>Turno más largo (min:seg)</label>
            <input type="text" data-i="${i}" data-k="turno" value="${reloj(s.turno)}" placeholder="4:30"></div>
        </div>
        <div class="field" style="margin:0"><label>Identidad de color del comandante</label>
          <div class="colors">${COLORES.map(c=>`<button type="button" class="color-btn" data-i="${i}" data-color="${c}"
            aria-pressed="${(s.id||"").includes(c)}"><i class="pip ${c}"></i></button>`).join("")}</div></div>
      </div>`).join("")}
    ${borrador.seats.length < 6 ? `<button class="btn" id="add-seat">Añadir jugador a la mesa</button>` : ""}`;

  abrirModal(editando ? "Editar partida" : "Nueva partida", cuerpo,
    `<button class="btn" id="cancelar">Cancelar</button>
     <button class="btn primary" id="guardar">${editando ? "Guardar cambios" : "Registrar partida"}</button>`);

  $("#f-fecha").onchange = e => borrador.fecha = e.target.value;
  $("#f-dur").oninput = e => borrador.duracion = +e.target.value;
  cajaModal.querySelectorAll("[data-k]").forEach(el=>{
    el.oninput = el.onchange = e=>{
      const {i,k} = e.target.dataset, v = e.target.value;
      borrador.seats[i][k] = (k==="rehacer"||k==="tiempo") ? Math.max(0,+v||0)
        : k==="turno" ? (isNaN(segundos(v)) ? borrador.seats[i].turno : segundos(v)) : v;
    };
  });
  cajaModal.querySelectorAll("[data-color]").forEach(b=> b.onclick = ()=>{
    const s = borrador.seats[b.dataset.i], c = b.dataset.color, set = new Set((s.id||"").split(""));
    set.has(c) ? set.delete(c) : set.add(c);
    s.id = COLORES.filter(x=>set.has(x)).join("");
    b.setAttribute("aria-pressed", set.has(c));
  });
  cajaModal.querySelectorAll("[data-quitar]").forEach(b=> b.onclick = ()=>{
    borrador.seats.splice(+b.dataset.quitar,1); pintarFormulario(editando);
  });
  const add = $("#add-seat");
  if(add) add.onclick = ()=>{ borrador.seats.push(seatVacio()); pintarFormulario(editando); };
  $("#cancelar").onclick = cerrarModal;
  $("#guardar").onclick = async ()=>{
    borrador.seats.forEach(s=>{ s.j = s.j.trim(); s.c = s.c.trim(); s.c2 = (s.c2||"").trim(); });
    errores = validar(borrador);
    if(errores.length){ pintarFormulario(editando); return; }
    const i = PARTIDAS.findIndex(p=>p.id===borrador.id);
    if(i>=0) PARTIDAS[i] = borrador; else PARTIDAS.push(borrador);
    await guardarPartidas(); cerrarModal(); pintarRegistro();
    aviso(editando ? "Partida actualizada" : "Partida registrada");
  };
}

function validar(g){
  const e = [];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(g.fecha||"")) e.push("Falta la fecha de la partida.");
  if(!(g.duracion > 0)) e.push("La duración tiene que ser mayor que cero.");
  if(!g.seats || g.seats.length < 2) e.push("Una partida necesita al menos dos jugadores.");
  (g.seats||[]).forEach((s,i)=>{
    if(!String(s.j||"").trim()) e.push(`El asiento ${i+1} no tiene nombre de jugador.`);
    if(!String(s.c||"").trim()) e.push(`El asiento ${i+1} no tiene comandante.`);
    if(!(s.turno >= 0)) e.push(`El turno más largo del asiento ${i+1} no es válido. Escríbelo como 4:30.`);
  });
  const nombres = (g.seats||[]).map(s=>String(s.j||"").trim().toLowerCase());
  if(new Set(nombres).size !== nombres.length) e.push("Hay un jugador repetido en la misma mesa.");
  const v = (g.seats||[]).filter(s=>s.r==="V").length, emp = (g.seats||[]).filter(s=>s.r==="E").length;
  if(emp && emp !== (g.seats||[]).length) e.push("Si la partida es un empate, todos tienen que estar marcados como empate.");
  else if(!emp && v !== 1) e.push("Marca exactamente un ganador, o pon a todos en empate.");
  return e;
}

function confirmarBorrado(id){
  const g = PARTIDAS.find(p=>p.id===id);
  abrirModal("Eliminar partida",
    `<p style="margin:0">Se borrará la partida del ${fechaLarga(g.fecha)} con ${esc(g.seats.map(s=>s.j).join(", "))}.
      La clasificación se recalculará sin ella y no se puede deshacer.</p>`,
    `<button class="btn" id="c1">Cancelar</button><button class="btn danger" id="c2">Eliminar partida</button>`);
  $("#c1").onclick = cerrarModal;
  $("#c2").onclick = async ()=>{
    PARTIDAS = PARTIDAS.filter(p=>p.id!==id);
    await guardarPartidas(); cerrarModal(); pintarRegistro(); aviso("Partida eliminada");
  };
}

function renombrar(nombre){
  const cuantas = PARTIDAS.filter(p=>p.seats.some(s=>s.j===nombre)).length;
  abrirModal("Cambiar el nombre del jugador",
    `<div class="field"><label for="nuevo">Nombre nuevo</label><input type="text" id="nuevo" value="${esc(nombre)}"></div>
     <p class="hint" style="margin:0">Se cambiará en las ${cuantas} partidas donde aparece.</p>`,
    `<button class="btn" id="r1">Cancelar</button><button class="btn primary" id="r2">Cambiar el nombre</button>`);
  const input = $("#nuevo"); input.focus(); input.select();
  $("#r1").onclick = cerrarModal;
  $("#r2").onclick = async ()=>{
    const nuevo = input.value.trim(); if(!nuevo) return;
    PARTIDAS.forEach(p=>p.seats.forEach(s=>{ if(s.j===nombre) s.j = nuevo; }));
    await guardarPartidas(); cerrarModal();
    vistaReg = {tipo:"jugador", nombre:nuevo}; pintarRegistro(); aviso("Nombre actualizado");
  };
}

/* ---------- copia de seguridad de toda la app ----------
   Un único archivo JSON con partidas, perfiles y ajustes. Se puede descargar,
   copiar al portapapeles, o pegar y cargar desde otro móvil. */
const FORMATO = 2;
function paqueteCompleto(){
  return {app:"mesa-commander", formato:FORMATO, exportado:new Date().toISOString(),
          partidas:PARTIDAS, perfiles:PERFILES, config:CONFIG};
}
function revisarPaquete(txt){
  const datos = JSON.parse(txt);
  if(!datos || typeof datos !== "object") throw new Error("El archivo no contiene datos de la app.");
  // admite tanto la copia completa como una lista suelta de partidas
  const p = Array.isArray(datos) ? {partidas:datos} : datos;
  const partidas = Array.isArray(p.partidas) ? p.partidas : [];
  const perfiles = Array.isArray(p.perfiles) ? p.perfiles : [];
  if(!partidas.length && !perfiles.length) throw new Error("No hay ni partidas ni perfiles que cargar.");
  const fallos = partidas.flatMap((g,i)=> validar(g).map(e=>`Partida ${i+1}: ${e}`));
  if(fallos.length) throw new Error(fallos.slice(0,4).join(" "));
  return {partidas:normalizar(partidas), perfiles:migrarPerfiles(perfiles),
          config:(p.config && typeof p.config === "object") ? p.config : null};
}
const huellaPartida = g => `${g.fecha}|${g.seats.map(x=>x.j).sort().join(",")}`;
const huellaMazo = m => `${(m.c||"").toLowerCase()}|${(m.c2||"").toLowerCase()}|${m.col||""}`;

function copiaSeguridad(){
  abrirModal("Copia de seguridad",
    `<p class="hint" style="margin:0 0 12px">Todo lo de la app en un archivo: ${PARTIDAS.length} partidas,
       ${PERFILES.length} perfiles y tus ajustes. Descárgalo, o cópialo y pégalo en otro dispositivo.</p>
     <div class="actions" style="margin-bottom:14px">
       <button class="btn" id="cs-bajar">${ic("datos",18)} Descargar archivo</button>
       <button class="btn" id="cs-copiar">${ic("lista",18)} Copiar al portapapeles</button>
       <label class="btn" for="cs-archivo">${ic("mas",18)} Abrir un archivo</label>
       <input type="file" id="cs-archivo" accept=".json,application/json" style="display:none">
     </div>
     <textarea id="cs-json" spellcheck="false">${esc(JSON.stringify(paqueteCompleto(), null, 2))}</textarea>
     <div id="cs-msg"></div>`,
    `<button class="btn danger" id="cs-ejemplo">${ic("deshacer",18)} Restaurar ejemplo</button>
     <button class="btn" id="cs-cerrar">Cerrar</button>
     <button class="btn" id="cs-combinar">Combinar</button>
     <button class="btn primary" id="cs-cargar">Reemplazar todo</button>`);

  const msg = (txt, mal) => $("#cs-msg").innerHTML = mal
    ? `<div class="errors" style="margin:12px 0 0">${esc(txt)}</div>`
    : `<p class="hint" style="margin:12px 0 0">${esc(txt)}</p>`;

  $("#cs-cerrar").onclick = cerrarModal;

  $("#cs-bajar").onclick = ()=>{
    try{
      const blob = new Blob([JSON.stringify(paqueteCompleto(), null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `mesa-commander-${hoy()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      msg("Archivo generado. Si tu navegador bloquea la descarga, copia el texto de abajo.");
    }catch(e){ msg("Este navegador no deja descargar desde aquí. Copia el texto de abajo.", true); }
  };

  $("#cs-copiar").onclick = async ()=>{
    const txt = $("#cs-json").value;
    try{
      await navigator.clipboard.writeText(txt);
      msg("Copiado. Pégalo en una nota o en el otro dispositivo.");
    }catch(e){
      $("#cs-json").select();
      msg("Selecciónalo y cópialo a mano: el navegador no da acceso al portapapeles.", true);
    }
  };

  $("#cs-archivo").onchange = e=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const lector = new FileReader();
    lector.onload = ()=>{ $("#cs-json").value = String(lector.result); msg(`Cargado ${f.name}. Ahora elige reemplazar o combinar.`); };
    lector.onerror = ()=> msg("No se ha podido leer el archivo.", true);
    lector.readAsText(f);
  };

  $("#cs-cargar").onclick = async ()=>{
    try{
      const d = revisarPaquete($("#cs-json").value);
      PARTIDAS = d.partidas;
      if(d.perfiles.length) PERFILES = d.perfiles;
      if(d.config) CONFIG = {...CONFIG, ...d.config};
      await Promise.all([guardarPartidas(), guardarPerfiles(), guardarConfig()]);
      cerrarModal(); vistaReg = {tipo:"ranking"};
      irA(document.querySelector('.tab[aria-selected="true"]').dataset.tab === "inicio" ? "inicio" : "registro");
      aviso("Datos reemplazados");
    }catch(err){ msg(err.message, true); }
  };

  $("#cs-combinar").onclick = async ()=>{
    try{
      const d = revisarPaquete($("#cs-json").value);
      const ids = new Set(PARTIDAS.map(g=>g.id));
      const huellas = new Set(PARTIDAS.map(huellaPartida));
      let nuevas = 0;
      for(const g of d.partidas){
        if(ids.has(g.id) || huellas.has(huellaPartida(g))) continue;
        PARTIDAS.push(g); ids.add(g.id); huellas.add(huellaPartida(g)); nuevas++;
      }
      let mazosNuevos = 0, perfilesNuevos = 0;
      for(const p of d.perfiles){
        const mio = PERFILES.find(x=>x.nombre.toLowerCase() === p.nombre.toLowerCase());
        if(!mio){ PERFILES.push(p); perfilesNuevos++; continue; }
        const tengo = new Set(mio.mazos.map(huellaMazo));
        for(const m of p.mazos) if(!tengo.has(huellaMazo(m))){ mio.mazos.push(m); tengo.add(huellaMazo(m)); mazosNuevos++; }
      }
      await Promise.all([guardarPartidas(), guardarPerfiles()]);
      cerrarModal(); pintarRegistro();
      aviso(`${nuevas} partidas, ${perfilesNuevos} perfiles y ${mazosNuevos} mazos añadidos`);
    }catch(err){ msg(err.message, true); }
  };

  $("#cs-ejemplo").onclick = async ()=>{
    PARTIDAS = normalizar(structuredClone(DEMO));
    PERFILES = migrarPerfiles(structuredClone(PERFILES_DEMO));
    await Promise.all([guardarPartidas(), guardarPerfiles()]);
    cerrarModal(); vistaReg = {tipo:"ranking"}; pintarRegistro();
    aviso("Datos de ejemplo restaurados");
  };
}

/* ==========================================================
   11. NAVEGACIÓN Y ARRANQUE
   ========================================================== */
function irA(tab){
  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#page-inicio").classList.toggle("on", tab === "inicio");
  $("#page-registro").classList.toggle("on", tab === "registro");
  tab === "inicio" ? pintarInicio() : pintarRegistro();
}
document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=> irA(b.dataset.tab));

(async function(){
  const [p, pf, jg, cf] = await Promise.all([leer(K.partidas), leer(K.perfiles), leer(K.juego), leer(K.config)]);
  PARTIDAS = normalizar(p || structuredClone(DEMO));
  PERFILES = pf ? migrarPerfiles(pf) : PERFILES_DEMO;
  CONFIG = {...CONFIG, ...(cf||{})};
  if(!p) await guardarPartidas();
  if(!pf) await guardarPerfiles();
  if(jg && jg.j){ JUEGO = migrarJuego({...jg, undo:[]}); JUEGO.tIni = Date.now(); }
  MESA = PERFILES.slice(0,4).map(x=> asientoDesde(x, mazoUltimo(x)));
  while(MESA.length < 4) MESA.push(null);
  irA("inicio");
  if(JUEGO) aviso("Tienes una partida sin terminar");
})();
</script>
